<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="yadroDiscLavTop" x1="8" y1="52" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8DFF8"/>
      <stop offset="1" stop-color="#C9B6EF"/>
    </linearGradient>
    <linearGradient id="yadroDiscLavSide" x1="8" y1="58" x2="56" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9A4E4"/>
      <stop offset="1" stop-color="#9B82D4"/>
    </linearGradient>
    <linearGradient id="yadroDiscDarkTop" x1="8" y1="36" x2="56" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A3A42"/>
      <stop offset="0.55" stop-color="#1C1C22"/>
      <stop offset="1" stop-color="#0E0E12"/>
    </linearGradient>
    <linearGradient id="yadroDiscDarkSide" x1="8" y1="42" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A2A32"/>
      <stop offset="1" stop-color="#09090C"/>
    </linearGradient>
    <linearGradient id="yadroDiscWhiteTop" x1="8" y1="20" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#F4F2F8"/>
      <stop offset="1" stop-color="#E4E0EE"/>
    </linearGradient>
    <linearGradient id="yadroDiscWhiteSide" x1="8" y1="26" x2="56" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8E4F0"/>
      <stop offset="1" stop-color="#C8C2D6"/>
    </linearGradient>
    <linearGradient id="yadroDiscPurpleTop" x1="8" y1="4" x2="56" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B57AFF"/>
      <stop offset="0.4" stop-color="#8B4DFF"/>
      <stop offset="1" stop-color="#6A1FE0"/>
    </linearGradient>
    <linearGradient id="yadroDiscPurpleSide" x1="8" y1="10" x2="56" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C28E3"/>
      <stop offset="1" stop-color="#4C12A8"/>
    </linearGradient>
    <radialGradient id="yadroHighlight" cx="0.32" cy="0.28" r="0.7">
      <stop stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="yadroSoftShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#7C28E3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="32" cy="68" rx="22" ry="3.2" fill="#7C28E3" opacity="0.12"/>

  <!-- Disc 4  lavender (bottom) -->
  <g filter="url(#yadroSoftShadow)">
    <path d="M8 56.5 C8 61.2 18.7 65 32 65 C45.3 65 56 61.2 56 56.5 L56 60.5 C56 65.2 45.3 69 32 69 C18.7 69 8 65.2 8 60.5 Z" fill="url(#yadroDiscLavSide)"/>
    <ellipse cx="32" cy="56.5" rx="24" ry="8.5" fill="url(#yadroDiscLavTop)"/>
    <ellipse cx="32" cy="56.5" rx="24" ry="8.5" fill="url(#yadroHighlight)" opacity="0.35"/>
  </g>

  <!-- Disc 3  charcoal -->
  <g>
    <path d="M8 40.5 C8 45.2 18.7 49 32 49 C45.3 49 56 45.2 56 40.5 L56 44.5 C56 49.2 45.3 53 32 53 C18.7 53 8 49.2 8 44.5 Z" fill="url(#yadroDiscDarkSide)"/>
    <ellipse cx="32" cy="40.5" rx="24" ry="8.5" fill="url(#yadroDiscDarkTop)"/>
    <ellipse cx="24" cy="38.5" rx="10" ry="3.2" fill="#FFFFFF" opacity="0.14"/>
  </g>

  <!-- Disc 2  frosted white -->
  <g>
    <path d="M8 24.5 C8 29.2 18.7 33 32 33 C45.3 33 56 29.2 56 24.5 L56 28.5 C56 33.2 45.3 37 32 37 C18.7 37 8 33.2 8 28.5 Z" fill="url(#yadroDiscWhiteSide)"/>
    <ellipse cx="32" cy="24.5" rx="24" ry="8.5" fill="url(#yadroDiscWhiteTop)"/>
    <ellipse cx="32" cy="24.5" rx="24" ry="8.5" fill="url(#yadroHighlight)" opacity="0.45"/>
  </g>

  <!-- Disc 1  purple glass (top) -->
  <g>
    <path d="M8 8.5 C8 13.2 18.7 17 32 17 C45.3 17 56 13.2 56 8.5 L56 12.5 C56 17.2 45.3 21 32 21 C18.7 21 8 17.2 8 12.5 Z" fill="url(#yadroDiscPurpleSide)"/>
    <ellipse cx="32" cy="8.5" rx="24" ry="8.5" fill="url(#yadroDiscPurpleTop)"/>
    <ellipse cx="32" cy="8.5" rx="24" ry="8.5" fill="url(#yadroHighlight)"/>
    <!-- glass rim highlight -->
    <ellipse cx="32" cy="8.5" rx="22.5" ry="7.2" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
  </g>
</svg>
